{% extends 'base.html' %}

{% block portal_title %}Admin Portal{% endblock %}

{% block sidebar %}
    <div class="sidebar-section">
        <div class="sidebar-section-title">DASHBOARD</div>
        <a href="{% url 'admin_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <i class="fas fa-tachometer-alt"></i> Overview
        </a>
    </div>
    
    <div class="sidebar-section">
        <div class="sidebar-section-title">USER MANAGEMENT</div>
        <a href="{% url 'admin_users' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
            <i class="fas fa-users"></i> All Users
        </a>
        <a href="{% url 'admin_create_user' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_create_user' %}active{% endif %}">
            <i class="fas fa-user-plus"></i> Create User
        </a>
    </div>
    
    <div class="sidebar-section">
        <div class="sidebar-section-title">CONTENT MANAGEMENT</div>
        <a href="{% url 'admin_questions' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_questions' %}active{% endif %}">
            <i class="fas fa-question-circle"></i> Questions
        </a>
        <a href="{% url 'admin_tests' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_tests' %}active{% endif %}">
            <i class="fas fa-file-alt"></i> Tests
        </a>
        <a href="{% url 'admin_submissions' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_submissions' %}active{% endif %}">
            <i class="fas fa-clipboard-check"></i> Submissions
        </a>
    </div>
    
    <div class="sidebar-section">
        <div class="sidebar-section-title">REPORTS & ANALYTICS</div>
        <a href="{% url 'admin_activity' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_activity' %}active{% endif %}">
            <i class="fas fa-chart-line"></i> Activity Logs
        </a>
    </div>
    
    <div class="sidebar-section">
        <div class="sidebar-section-title">SUPPORT</div>
        <a href="{% url 'admin_help' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_help' %}active{% endif %}">
            <i class="fas fa-question-circle"></i> Help Portal
        </a>
    </div>
{% endblock %}
