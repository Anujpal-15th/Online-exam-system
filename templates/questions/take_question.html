{% extends 'base.html' %}
{% block title %}Answer Question{% endblock %}
{% block content %}

<div class="answer-container">
  <div class="timer" id="timer">30:00</div>

  <h2>Answer Question</h2>
  <div class="question-text">
    <strong>Question:</strong> {{ question.question_text }}
  </div>

  <form method="POST" id="answerForm">
    {% csrf_token %}
    <textarea name="answer_text" rows="5" placeholder="Type your answer here..." required></textarea>

    <div class="button-row">
      <button type="submit">Submit Answer</button>
      <a href="{% url 'questions_list' %}" class="back-btn">Back</a>
    </div>
  </form>
</div>

<script>
  // Timer: 30 minutes (in seconds)
  let timeLeft = 30 * 60;

  const timerDisplay = document.getElementById("timer");
  const form = document.getElementById("answerForm");

  const countdown = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerDisplay.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

    if (timeLeft <= 0) {
      clearInterval(countdown);
      alert("⏰ Time's up! Your test time has ended.");
      form.submit(); // You can remove this line if you don’t want auto-submit
    }

    timeLeft--;
  }, 1000);
</script>

{% endblock %}
