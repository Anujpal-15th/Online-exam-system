<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #222;">
    <h2>Verify your email</h2>
    <p>Hi <strong>{{ user.username }}</strong>,</p>
    <p>Thanks for registering at {{ site_name }}. Please click the button below to verify your email:</p>
    <p>
      <a href="{{ verify_url }}" style="background:#2563eb; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none; display:inline-block;">
        Verify Email
      </a>
    </p>
    <p>Or copy and paste this link into your browser:<br>
      <a href="{{ verify_url }}">{{ verify_url }}</a>
    </p>
    <p>If you did not request this, you can ignore this email.</p>
  </body>
</html>
