<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; padding: 30px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 10px 10px; }
        .success-box { background: #d4edda; border-left: 4px solid #28a745; padding: 20px; margin: 20px 0; border-radius: 5px; text-align: center; }
        .btn { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; text-decoration: none; border-radius: 25px; margin: 20px 0; }
        .footer { text-align: center; margin-top: 20px; color: #777; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✅ Account Reactivated</h1>
        </div>
        <div class="content">
            <p>Hello {{ user.get_full_name }},</p>
            
            <div class="success-box">
                <p style="margin: 0; font-size: 18px; font-weight: bold;">
                    Good news! Your {{ site_name }} account has been reactivated.
                </p>
            </div>
            
            <p>You can now log in and access all features.</p>
            
            <p style="text-align: center;">
                <a href="{{ request.scheme }}://{{ request.get_host }}" class="btn">Log In Now</a>
            </p>
            
            <p>Welcome back!</p>
            
            <div class="footer">
                <p>Best regards,<br>The {{ site_name }} Team</p>
            </div>
        </div>
    </div>
</body>
</html>
